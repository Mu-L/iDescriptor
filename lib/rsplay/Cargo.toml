[package]
name = "rsplay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reusable Rust AirPlay receiver library for iDescriptor"
publish = false

[features]
default = []
appimage = []

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.24"
directories = "6"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
log = "0.4.33"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shairplay = { path = "/Users/uncore/Desktop/clones/shairplay-rust", features = ["video"] }
tokio = { version = "1.50.0", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
izeroconf = { path = "/Users/uncore/Desktop/clones/izeroconf/zeroconf", default-features = false, features = ["native-backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
izeroconf = { path = "/Users/uncore/Desktop/clones/izeroconf/zeroconf", default-features = false, features = ["pure-rust"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time"] }
