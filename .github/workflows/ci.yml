name: iDescriptor CI (Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: false
        default: "dev"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: false
        type: string
  push:
    branches:
      - "**"
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.cxx"
      - "**.cc"
      - "**.rs"
      - "**.qml"
      - "**.cmake"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.cxx"
      - "**.cc"
      - "**.rs"
      - "**.qml"
      - "**.cmake"
      - ".github/workflows/ci.yml"
env:
  QT_VERSION: "6.9.2"
  LIBPLIST_VER: "2.7.0"

jobs:
  build-linux:
    name: Linux ${{ matrix.asset_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_arch: x86_64
            qt_host: linux
            gst_good_version: 1.22.12
            gst_good_sha256: 9c1913f981900bd8867182639b20907b28ed78ef7a222cfbf2d8ba9dab992fa7
            patch_gstreamer: true
            # Qt for Linux Arm is only available on Ubuntu 24.04 and later
          - runner: ubuntu-24.04-arm
            asset_arch: arm64
            qt_host: linux_arm64
            gst_good_version: 1.24.13
            gst_good_sha256: 574ac6f9fd84b32eb04e80572391d6762df6f9802a47bc0386cd6cc48c14d08b
            patch_gstreamer: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            checkinstall \
            git \
            ninja-build \
            pkg-config \
            libpugixml-dev \
            libusb-1.0-0-dev \
            libqrencode-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libtool-bin \
            libreadline-dev \
            libavahi-compat-libdnssd-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-gl \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-pipewire \
            libfuse2 \
            libunwind-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libheif-dev \
            libzip-dev \
            libssh-dev \
            libfuse3-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            python3-pip

      - name: Install Meson
        run: |
          python3 -m pip install --user "meson==1.11.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"
          dir: ${{ github.workspace }}

      - name: Build qml6glsink
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.gst_good_version }}"
          archive="gst-plugins-good-${version}.tar.xz"
          wget "https://gstreamer.freedesktop.org/src/gst-plugins-good/${archive}"
          echo "${{ matrix.gst_good_sha256 }}  ${archive}" | sha256sum --check
          tar -xf "${archive}"
          cd "gst-plugins-good-${version}"

          if [[ "${{ matrix.patch_gstreamer }}" == "true" ]]; then
            patch -p1 < "${GITHUB_WORKSPACE}/.github/patches/gst-plugins-good-1.22-gstreamer-1.20.patch"
          fi

          meson setup build-qml6 . \
            --prefix=/usr \
            --libdir="lib/$(uname -m)-linux-gnu" \
            --auto-features=disabled \
            -Dqt-method=qmake \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dqt-x11=enabled \
            -Dqt-wayland=disabled \
            -Dqt-egl=disabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-qml6
          GST_PLUGIN_PATH_1_0="${PWD}/build-qml6/ext/qt6" gst-inspect-1.0 qml6glsink >/dev/null
          sudo install -Dm755 build-qml6/ext/qt6/libgstqml6.so \
            "/usr/lib/$(uname -m)-linux-gnu/gstreamer-1.0/libgstqml6.so"

      # building from source is intentional, we want to match the version of libplist everywhere
      - name: Build libplist
        shell: bash
        run: |
          set -euo pipefail
          workspace="$PWD"
          tmp="$RUNNER_TEMP/idescriptor-libs"
          mkdir -p "$tmp"
          cd "$tmp"
          base_url="https://github.com/libimobiledevice"
          libs=(libplist)

          for name in "${libs[@]}"; do
            ver_var=$(echo "${name^^}_VER" | sed 's/-/_/g')
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (environment variable $ver_var)"
              exit 1
            fi
            archive="${name}-${ver}.tar.bz2"
            curl --retry 3 --retry-delay 5 -L -o "$archive" \
              "${base_url}/${name}/releases/download/${ver}/${archive}"
            tar xjf "$archive"
            pushd "${name}-${ver}"
            ./configure
            make -j"$(nproc)"
            sudo make install
            popd
          done
          cd "$workspace"

      - name: Update linker cache
        run: sudo ldconfig

      - name: Build iDescriptor
        run: RUSTFLAGS="" cargo build --release --features appimage

      - name: Resolve build version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "version=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and validate AppImage
        shell: bash
        run: |
          bash packaging/linux/appimage/deploy.sh "${{ steps.vars.outputs.version }}" "${{ matrix.asset_arch }}"
          test -x "iDescriptor-${{ steps.vars.outputs.version }}-Linux_${{ matrix.asset_arch }}.AppImage"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.asset_arch }}
          path: iDescriptor-${{ steps.vars.outputs.version }}-Linux_${{ matrix.asset_arch }}.AppImage
          if-no-files-found: error
